aid: irisvr
name: IrisVR
description: >-
  IrisVR is a virtual-reality software company for the architecture, engineering,
  and construction (AEC) industry, best known for its two products: Prospect, a
  desktop application that converts Revit, SketchUp, Rhino, Navisworks and other
  3D/BIM models into immersive VR walkthroughs in one click, and Scope, a mobile
  app for viewing and sharing 360-degree panoramas on standalone and phone-based
  VR headsets. Founded in New York, IrisVR was acquired by The Wild in 2021, and
  The Wild (together with IrisVR) was subsequently acquired by Autodesk in 2022.
  The products and support site remain available. IrisVR does not publish a public
  developer API; this profile tracks its identity, packages, and public web
  properties in the API Evangelist network.
